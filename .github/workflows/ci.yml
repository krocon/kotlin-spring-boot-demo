name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: JDK 25 einrichten (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew build
